# Render blueprint for the hosted Nexus demo: the API as a Docker web service, and its
# PostgreSQL database. Create both from Render's dashboard with New > Blueprint and this
# repository. See docs/deployment/demo-hosting.md.
#
# Synthetic demonstration data only. Not for real patient data.
#
# TRIAL: both are on Render's free plans (owner direction, November 12, 2026), to see the
# demonstration live before paying. On free plans the API sleeps after 15 minutes
# without a request and takes about a minute to wake, and the database is deleted 30
# days after it is created and has no backups. To keep the demonstration, change the
# two `plan` lines to the paid values in the comments beside them (about $14.50 a
# month in total, with `diskSizeGB: 5` on the database) before the 30 days are up.
services:
  - type: web
    name: nexus-api
    runtime: docker
    dockerfilePath: ./infra/dockerfiles/Dockerfile.api
    dockerContext: .
    plan: free # paid: 0.5c-512mb
    region: oregon
    branch: main
    # Liveness, which never touches the database: a busy or briefly unreachable database
    # must not make Render restart a working process. /healthz reports readiness.
    healthCheckPath: /livez
    # Deploy a commit on main only after its GitHub checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      # The identity provider (Auth0 tenant and its "Nexus Demo" application) and the site
      # that may call this API. None is a secret: the browser is sent all of them. Change
      # them here if the tenant, the application or the site address changes.
      - key: NEXUS_OIDC_ISSUER
        value: https://dev-vulcan-01.us.auth0.com/
      - key: NEXUS_OIDC_CLIENT_ID
        value: hiSdQk1bhasqtTMo2Lu60Jba3qa2htJt
      - key: NEXUS_OIDC_AUDIENCE
        value: hiSdQk1bhasqtTMo2Lu60Jba3qa2htJt
      # offline_access lets a session renew itself instead of ending when the identity
      # token expires. The application has refresh token rotation on.
      - key: NEXUS_OIDC_SCOPES
        value: openid email profile offline_access
      - key: NEXUS_ALLOWED_ORIGINS
        value: https://nexus-demo-orcin.vercel.app
      # Request limits are counted per client address. Set this to the number of Render's
      # own proxies only, read from the API log after the first deploy (see "Request
      # limits" in docs/deployment/demo-hosting.md). Do not count Vercel: this service's
      # onrender.com address is public, so a count that includes Vercel would let a
      # direct caller choose the address it is counted under. Until it is set, every
      # caller shares one limit.
      - key: NEXUS_TRUSTED_PROXIES
        value: "0"
      # With the setting above done correctly, people who come through the site are still
      # counted together, per Vercel address, so the limits are higher than the defaults
      # (1200 and 3000 a minute): about 50 visit participants polling at once.
      - key: NEXUS_RATE_LIMIT_OPEN_PER_MINUTE
        value: "3000"
      - key: NEXUS_RATE_LIMIT_OPEN_BURST
        value: "600"
      - key: NEXUS_RATE_LIMIT_PER_MINUTE
        value: "6000"
      - key: NEXUS_RATE_LIMIT_BURST
        value: "1200"

databases:
  - name: nexus-db
    plan: free # paid: 0.1c-256mb, and add `diskSizeGB: 5` (the paid default is 15 GB,
    # storage is billed per GB, and a disk can be raised later but never lowered)
    postgresMajorVersion: "17"
    region: oregon
    databaseName: nexus
    user: nexus
