[package]
name = "emr-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license.workspace = true

[dependencies]
# Web framework
# Default features without http2: the server binds plain HTTP/1.1 (a host's proxy
# terminates TLS), and the h2 0.3 line actix-http uses has no fix for RUSTSEC-2026-0258.
# 4.18.2 is the first release with the request-decompression fixes.
actix-web = { version = "4.18.2", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode"] }
actix-cors = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ring = "0.17"
# rustls (ring) is needed to fetch the identity provider's signing keys over HTTPS.
reqwest = { workspace = true, features = ["rustls-tls"] }
# Hosted sign-in: verifies identity-provider JWTs. No PEM parsing; keys arrive as JWKs.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Environment variables
dotenvy = "0.15"

# Error handling
thiserror = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }

[dev-dependencies]
# Test-only: generates the RSA signing key inside the OIDC verification tests.
aws-lc-rs = "1.15"
