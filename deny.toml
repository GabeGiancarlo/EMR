# cargo-deny configuration for Nexus
# This file configures cargo-deny to check for security vulnerabilities,
# license compliance, and dependency issues

[graph]
# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Local development machines. wasm32 was listed here before, but the API
    # is never built for it.
    "aarch64-apple-darwin",
]

[output]
# When outputting inclusion graphs in diagnostics that include features, this
# option can be used to specify the depth at which feature edges will be added
feature-depth = 1

[advisories]
# Written for cargo-deny 0.20. A vulnerability advisory on a crate in the
# compiled graph always fails; the old `vulnerability` and `notice` keys no
# longer exist.
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates fail only when the API depends on them directly.
# Unmaintained transitive crates still appear in the `cargo audit` report.
unmaintained = "workspace"
# Unsound crates fail only when the API depends on them directly.
unsound = "workspace"
# The lint level for crates that have been yanked from their source registry
yanked = "warn"
# Advisory IDs to ignore. Each entry needs a reason; an ignored advisory is
# still printed as a note.
ignore = [
    #{ id = "RUSTSEC-0000-0000", reason = "why this does not apply" },
]

[licenses]
# The confidence threshold for detecting a license from a license text.
# 0.8 = 80% confidence
confidence-threshold = 0.8
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Permissive licences used by crates in the compiled graph.
    "Unicode-3.0",          # ICU and unicode-* data tables
    "Zlib",                 # foldhash, zlib-rs
    "CDLA-Permissive-2.0",  # webpki-roots (Mozilla CA bundle)
]
# Any licence that is not in `allow` fails, so copyleft licences (GPL, AGPL,
# LGPL, MPL) are rejected without a separate deny list.

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
highlight = "all"
# The default lint level for `default-features` being enabled
allow-wildcard-paths = true

# List of crates that are allowed. Use with care!
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]

# List of crates to deny
deny = [
    # Each entry the name of a crate and a version range. If version is
    # not specified, all versions will be matched.
    #{ name = "ansi_term", version = "=0.11.0" },
]

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #{ name = "ansi_term", version = "=0.11.0" },
]

# Similarly to `skip` allows you to skip certain crates from being checked. Unlike
# `skip`, a skipped dependency must be explicitly known to use duplicate versions.
skip-tree = [
    #{ name = "ansi_term", version = "=0.11.0", depth = 20 },
]

[sources]
# Every crate must come from crates.io. A crate from another registry or from
# a git repository fails the check until its source is added below on purpose.
unknown-registry = "deny"
unknown-git = "deny"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []
