name: Continuous Integration

on:
  push:
    branches: [main, dev, develop, nexus/integrated-prototype, 'codex/**', 'feature/**']
  pull_request:
    branches: [main, dev, develop, nexus/integrated-prototype]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  orchestration:
    name: Worker accounting regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools -p 'test_grok_research.py' -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build workspace
        run: cargo build --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_local
          POSTGRES_DB: nexus_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nexus:nexus_local@127.0.0.1:55432/nexus_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        run: cargo test --locked --workspace
      - name: PostgreSQL hosted sign-in integration
        run: cargo test --locked --test oidc_postgres -- --ignored
      - name: PostgreSQL workflow integration
        run: cargo test --locked --test postgres -- --ignored
      - name: PostgreSQL CSV export integration
        run: cargo test --locked --test exports_postgres -- --ignored
      - name: PostgreSQL form routing integration
        run: cargo test --locked --test form_requirements_postgres -- --ignored
      - name: PostgreSQL speech authorization integration
        run: cargo test --locked --test speech_postgres -- --ignored
      - name: PostgreSQL adult intake integration
        run: cargo test --locked --test intake_postgres -- --ignored
      - name: PostgreSQL patient identity and admission integration
        run: cargo test --locked --test patient_identity_postgres --test admissions_postgres -- --ignored
      - name: PostgreSQL program configuration and routing integration
        run: cargo test --locked --test program_catalog_postgres --test program_admission_postgres --test program_services_postgres -- --ignored
      - name: PostgreSQL canonical claim identity and migration integration
        run: cargo test --locked --test service_code_upgrade_postgres --test claim_canonical_http -- --ignored --test-threads=1
      - name: PostgreSQL scheduling and availability integration
        run: cargo test --locked --test scheduling_postgres -- --ignored
      - name: PostgreSQL telehealth participation and signaling integration
        run: cargo test --locked --test telehealth_postgres -- --ignored
      - name: PostgreSQL transcript review and provenance integration
        run: cargo test --locked --test transcripts_postgres -- --ignored
      - name: PostgreSQL approved patient knowledge integration
        run: cargo test --locked --test knowledge_postgres -- --ignored
      - name: PostgreSQL owned worker terminal recovery
        run: "cargo test --locked --lib worker::tests:: -- --ignored --test-threads=1"
      - name: PostgreSQL clinical drafting and review integration
        run: cargo test --locked --test drafting_postgres -- --ignored
      - name: PostgreSQL recording consent and encrypted media integration
        run: cargo test --locked --test recordings_postgres -- --ignored

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-api-smoke:
    name: Docker API Build Smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/dockerfiles/Dockerfile.api
          push: false
          tags: nexus-api:ci-smoke
