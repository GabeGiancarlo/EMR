# cargo-audit configuration, read by the Security Analysis workflow.
#
# cargo audit checks every entry in Cargo.lock, whether or not the crate is
# compiled. An advisory is listed here only when it cannot affect the built
# API, and each entry says why. Remove an entry as soon as its reason stops
# being true.

[advisories]
ignore = [
    # rsa 0.9.10, Marvin attack timing side channel.
    # Locked only as a dependency of sqlx-mysql. Cargo.lock records sqlx's
    # optional MySQL driver even though the API enables only the `postgres`
    # feature, so the crate is never compiled:
    # `cargo tree --workspace --target all -i rsa` prints nothing.
    "RUSTSEC-2023-0071",

    # libsqlite3-sys 0.30.1, bundled SQLite CVE.
    # Locked only as a dependency of sqlx-sqlite, the optional SQLite driver,
    # which is not enabled and never compiled:
    # `cargo tree --workspace --target all -i libsqlite3-sys` prints nothing.
    "RUSTSEC-2026-0459",

    # h2 0.3.27, unbounded empty DATA frames (HTTP/2).
    # Compiled through actix-web's default `http2` feature, but not reachable:
    # api/src/main.rs starts the server with `HttpServer::bind`, which serves
    # HTTP/1.x only. HTTP/2 needs a TLS bind or `bind_auto_h2c`, and neither
    # is used. There is no fixed h2 0.3 release and actix-http 3 requires
    # h2 0.3. Revisit when the server terminates TLS itself, calls
    # `bind_auto_h2c`, or actix-http moves to h2 0.4. The same entry is in
    # deny.toml.
    "RUSTSEC-2026-0258",
]
